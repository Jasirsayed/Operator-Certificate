<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --tuv:#0e5aa7; --tuv-d:#003b73; --ink:#1c2530; --muted:#6b7785; --line:#e3e8ee; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:radial-gradient(1000px 500px at 70% -10%,#dbe8f6,transparent 60%),#eef2f6;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:18px 26px;background:#fff;border-bottom:1px solid var(--line)}
  header svg{width:34px;height:34px}
  header h1{font-family:'Fraunces',serif;font-size:18px;color:var(--tuv-d)}
  main{flex:1;display:grid;place-items:center;padding:30px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 50px rgba(20,45,80,.12);max-width:520px;width:100%;overflow:hidden}
  .card-top{padding:26px 28px;border-bottom:1px solid var(--line)}
  .card-top h2{font-family:'Fraunces',serif;font-size:20px;color:var(--tuv-d)}
  .card-top p{font-size:13px;color:var(--muted);margin-top:3px}
  .status{display:flex;align-items:center;gap:12px;padding:18px 28px;font-weight:600}
  .status.ok{background:#eafbf0;color:#0a7d3c}
  .status.bad{background:#fdeeee;color:#b3261e}
  .status.idle{background:#f4f8fc;color:var(--tuv)}
  .status svg{width:24px;height:24px;flex-shrink:0}
  .body{padding:22px 28px 28px}
  .lookup{display:flex;gap:10px;margin-bottom:8px}
  .lookup input{flex:1;padding:11px 13px;border:1px solid #d6dee6;border-radius:10px;font-size:14px;font-family:inherit}
  .lookup input:focus{outline:none;border-color:var(--tuv);box-shadow:0 0 0 3px rgba(14,90,167,.12)}
  .lookup button{padding:11px 18px;border:none;border-radius:10px;background:linear-gradient(180deg,#1370c9,var(--tuv));color:#fff;font-weight:600;font-family:inherit;cursor:pointer}
  .rows{margin-top:18px;display:none}
  .rows.show{display:block}
  .r{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .r:last-child{border-bottom:none}
  .r .k{color:var(--muted);font-weight:500}
  .r .v{color:var(--ink);font-weight:600;text-align:right}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:16px}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 50"><path d="M32 4 L60 46 L40 46 L32 30 L24 46 L4 46 Z" fill="#0e5aa7"/><path d="M30 34 C36 30 44 30 50 36 L46 44 C42 40 36 40 32 42 Z" fill="#0e5aa7"/></svg>
  <h1>Certificate Verification</h1>
</header>
<main>
  <div class="card">
    <div class="card-top">
      <h2>Verify an assessment certificate</h2>
      <p>Enter or scan a certificate number to check its details.</p>
    </div>
    <div class="status idle" id="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span id="statusText">Enter a certificate number below.</span>
    </div>
    <div class="body">
      <div class="lookup">
        <input type="text" id="q" placeholder="e.g. TRO-OP-26-0017" />
        <button id="go">Verify</button>
      </div>
      <div class="rows" id="rows"></div>
    </div>
  </div>
</main>
<footer>Verification reads from <code>certificates.json</code> in this repository.</footer>

<script>
/* Optional registry. Add issued certificates here (or generate this file from your records). */
const REGISTRY = {
  "TRO-OP-26-0017": {
    "Name": "Babar Ali Ghulam Abbas",
    "ID No.": "119228131",
    "Company": "Three Star Galaxy International LLC",
    "Qualification": "Safe Backhoe Loader Operation Assessment",
    "Assessment date": "14 January 2026",
    "Valid until": "13 January 2027"
  }
};

const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const rowsEl = document.getElementById('rows');
const qEl = document.getElementById('q');

function setStatus(kind, text){
  statusEl.className = 'status ' + kind;
  statusText.textContent = text;
  const icon = kind==='ok'
    ? '<path d="M20 6L9 17l-5-5"/>'
    : kind==='bad'
      ? '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>'
      : '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>';
  statusEl.querySelector('svg').innerHTML = icon;
}

function verify(id){
  id = (id||'').trim();
  rowsEl.classList.remove('show'); rowsEl.innerHTML='';
  if(!id){ setStatus('idle','Enter a certificate number below.'); return; }
  const rec = REGISTRY[id] || REGISTRY[id.toUpperCase()];
  if(!rec){ setStatus('bad','No certificate found with that number.'); return; }
  setStatus('ok','Valid certificate — details verified.');
  rowsEl.innerHTML = `<div class="r"><span class="k">Certificate No</span><span class="v">${id.toUpperCase()}</span></div>` +
    Object.entries(rec).map(([k,v])=>`<div class="r"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  rowsEl.classList.add('show');
}

document.getElementById('go').addEventListener('click',()=>verify(qEl.value));
qEl.addEventListener('keydown',e=>{ if(e.key==='Enter') verify(qEl.value); });

// Auto-verify from ?id= in the URL (so QR codes can deep-link here)
const params = new URLSearchParams(location.search);
if(params.get('id')){ qEl.value = params.get('id'); verify(params.get('id')); }
</script>
</body>
</html>
